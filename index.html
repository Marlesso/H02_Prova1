{ t: "1 · Noções gerais", r: `<h3>Problema econômico e custo de oportunidade</h3>
<ul><li><b>Problema econômico:</b> necessidades humanas ilimitadas × recursos finitos (<b>escassez</b>). Por isso é preciso fazer escolhas racionais.</li>
<li><b>Custo de oportunidade:</b> benefícios não aproveitados da alternativa preterida (abandonada). Está em toda escolha, de pessoas, empresas e governos (ex.: prefeito que constrói ponte em vez de equipar o hospital).</li></ul>
<h3>Pirâmide de Maslow (da base ao topo)</h3>
<ul><li>Fisiológicas e segurança (<b>necessidades básicas</b>), sociais, autoestima e autorrealização.</li>
<li>A necessidade humana nunca cessa: ao atingir um objetivo, surge outro.</li></ul>
<h3>Definição de Economia</h3>
<ul><li><b>Samuelson:</b> estudo de como pessoas e sociedade decidem empregar recursos escassos, com usos alternativos, para produzir bens e distribuí-los. É a <b>ciência da escolha e da tomada de decisão</b>.</li>
<li><b>PIB:</b> soma de todos os bens e serviços <i>finais</i> produzidos em um país, estado ou cidade em um período. Mede a riqueza.</li>
<li><b>Microeconomia:</b> decisões individuais de consumidores e empresas. <b>Macroeconomia:</b> agregados (PIB, investimento, desemprego, inflação, juros, dólar).</li></ul>
<h3>Fatores de produção</h3>
<div class="tw"><table><tr><th>Fator</th><th>Remuneração</th></tr><tr><td>Terra (recursos naturais)</td><td>Aluguel</td></tr><tr><td>Trabalho</td><td>Salário</td></tr><tr><td>Capital (máquinas, infraestrutura)</td><td>Juros</td></tr><tr><td>Organização/administração</td><td>Lucro</td></tr><tr><td>Tecnologia</td><td>Royalties</td></tr></table></div>
<ul><li>A soma das remunerações forma a <b>renda da nação</b> (lado monetário); os bens produzidos formam o lado real.</li>
<li>Para formar capital, o homem precisou abrir mão do consumo imediato. Gestão e tecnologia são os fatores mais modernos.</li></ul>
<h3>O Brasil e os fatores de produção</h3>
<ul><li><b>Terra:</b> riqueza natural impressionante, mas é o fator mais primitivo; abundância não garante desenvolvimento.</li>
<li><b>Trabalho:</b> 6ª maior população, porém mão de obra pouco qualificada.</li>
<li><b>Capital:</b> infraestrutura precária, majoritariamente estatal e com baixo investimento.</li>
<li><b>Gestão:</b> deficiente nas pequenas e médias empresas. <b>Tecnologia:</b> falta investimento privado em pesquisa; ilhas de excelência no Centro-Sul (SP).</li>
<li><b>Potencial:</b> energia (hidrelétrica, solar, eólica, pré-sal, etanol; maior exportador de etanol), minérios (60% do tântalo, 90% do nióbio; Pará e Minas Gerais), alimentos (5º maior território, só ~7,6% usado em lavouras), água doce (apostila cita 12% no texto e 16% no quadro).</li></ul>
<h3>Por que o Brasil é pouco competitivo</h3>
<ul><li><b>Rankings:</b> 56º no IMD (2020, entre 63) e 71º no WEF (2019, entre 141); 143º em liberdade econômica (Heritage, 2021).</li>
<li><b>Causas:</b> Estado grande e carga tributária alta, burocracia, infraestrutura insuficiente, sistema jurídico lento, corrupção e instituições extrativistas (Acemoglu e Robinson).</li>
<li>Liberdade permite <b>divisão do trabalho</b>, que aumenta produtividade; intervenção excessiva a limita e favorece populismo.</li></ul>
<h3>Custo do capital (TMA × TIR)</h3>
<ul><li><b>Custo do capital</b> = preço do dinheiro (juros). Reflete o custo de oportunidade.</li>
<li><b>TMA</b> = custo do capital. <b>TIR</b> = rentabilidade do projeto. <b>TIR &gt; TMA:</b> viável (cria riqueza). <b>TIR &lt; TMA:</b> inviável (destrói riqueza).</li>
<li><b>Exemplo:</b> R$ 500 mil = R$ 200 mil próprios a 18% + R$ 300 mil financiados a 16%. TMA = (200×0,18 + 300×0,16) ÷ 500 = <b>16,8%</b>. TIR = 90.000 ÷ 500.000 = <b>18%</b>. Viável.</li>
<li><b>Selic alta:</b> eleva o custo do capital, projetos são abandonados, a atividade e o emprego caem. Em contrapartida, controla a inflação.</li></ul>
<h3>Tipos de bens</h3>
<ul><li><b>Livres</b> (ar, luz solar, água do mar): abundantes, sem preço. <b>Econômicos:</b> exigem esforço humano e têm preço.</li>
<li><b>Materiais</b> (físicos) × <b>imateriais/serviços</b> (consultoria, consulta médica, software).</li>
<li><b>Privados</b> (proprietário identificável) × <b>públicos</b> (do Estado, uso coletivo: praças, estradas, rios, praias).</li>
<li><b>Intermediários</b> (insumos transformados) × <b>finais</b> (prontos para uso). Depende do uso: pneu na montadora é intermediário; trocado no seu carro é final.</li>
<li><b>Consumo</b> (perecíveis, semiduráveis, duráveis) × <b>capital</b> (máquinas, ferramentas, infraestrutura, capital humano e capital social).</li></ul>
<h3>Mercado</h3>
<ul><li>Trocas voluntárias entre ofertantes e demandantes, que poupam tempo e permitem a <b>especialização</b> (exemplo do sanduíche de US$ 1.500 em 6 meses).</li></ul>`,
 q: [
["Uma empresa investirá R$ 400 mil em um projeto. Desse total, R$ 150 mil são capital próprio, com custo de 20% a.a., e R$ 250 mil vêm de financiamento a 12% a.a. O projeto tem TIR de 15,5% a.a. Calcule a TMA (custo médio ponderado do capital) e assinale a alternativa correta.", ["TMA de 16,0% a.a.; projeto inviável, pois TIR < TMA","TMA de 16,0% a.a.; projeto viável, pois TIR > TMA","TMA de 15,0% a.a.; projeto viável, pois TIR > TMA","TMA de 15,0% a.a.; projeto inviável, pois TIR < TMA","TMA de 12,0% a.a.; projeto inviável, pois TIR < TMA"], 2, "TMA = (150×0,20 + 250×0,12) ÷ 400 = (30 + 30) ÷ 400 = 15%. Como 15,5% > 15%, é viável. Os 16% vêm da média simples, que ignora os pesos de cada fonte."],
["Sobre custo de oportunidade e classificação de bens, " + A + "I – Em toda escolha há custo de oportunidade, inclusive nas decisões de governo: se o prefeito constrói uma ponte em vez de equipar o hospital, o custo é o benefício do hospital equipado que deixou de existir." + B + "II – Bens livres, como o ar e a luz solar, têm preço elevado por serem essenciais à vida." + B + "III – Um mesmo bem pode ser final ou intermediário conforme o uso: o pneu trocado pelo dono do carro é final; o pneu comprado pela montadora é intermediário." + B + "IV – Bens de capital são aqueles consumidos diretamente para satisfazer necessidades, como alimentos e roupas.", ["I e II","I e III","II e IV","III e IV","Todas estão corretas"], 1, "II está errada: bens livres existem em abundância e não têm preço. IV está errada: o que satisfaz necessidades é bem de consumo; bem de capital produz outros bens."],
["Sobre custo do capital e taxa de juros, " + A + "I – O custo do capital é o preço do dinheiro e reflete o custo de oportunidade decorrente da escassez de recursos." + B + "II – A elevação da Selic reduz o custo do capital e estimula a execução de novos projetos." + B + "III – Quando a TIR é menor que a TMA, executar o investimento destrói riqueza." + B + "IV – Juros mais altos tendem a contrair a atividade e o emprego, mas são importante instrumento de política monetária para controlar a inflação.", ["I e II","II e III","I, III e IV","II, III e IV","Todas estão corretas"], 2, "II está errada: Selic mais alta eleva o custo do capital, e vários projetos deixam de ser viáveis."],
["Em relação ao Brasil e aos fatores de produção, assinale a alternativa correta:", ["O Brasil lidera os rankings de competitividade do IMD e do WEF graças à infraestrutura moderna.","A abundância de recursos naturais (terra), fator mais avançado, é suficiente para garantir o desenvolvimento.","A mão de obra brasileira é muito qualificada; o problema do país é ter população pequena.","Apesar da riqueza natural, o país é limitado por mão de obra pouco qualificada, infraestrutura precária, falhas de gestão nas pequenas e médias empresas e pouco investimento em tecnologia.","A infraestrutura é majoritariamente privada e recebe elevados investimentos."], 3, "A terra é o fator mais primitivo e sua abundância não basta. O Brasil está em 56º (IMD) e 71º (WEF), tem a 6ª maior população e infraestrutura majoritariamente estatal, com baixo investimento."],
["Classifique, na ordem, os itens: (1) uma consulta médica; (2) uma praça pública; (3) as máquinas de uma fábrica; (4) a luz solar.", ["bem material; bem privado; bem de consumo; bem econômico","bem imaterial (serviço); bem privado; bem intermediário; bem livre","bem material; bem público; bem de capital; bem econômico","bem imaterial (serviço); bem público; bem de consumo; bem livre","bem imaterial (serviço); bem público; bem de capital; bem livre"], 4, "Consulta é serviço (imaterial); praça pertence ao Estado e é de uso coletivo (público); máquinas produzem outros bens (capital); luz solar é abundante e sem preço (livre)."]
]},
{ t: "2 · Inflação e câmbio", r: `<h3>Inflação: conceito e efeitos</h3>
<ul><li><b>Inflação:</b> aumento generalizado dos preços. A apostila adota a visão da Escola Austríaca (Mises): a causa é descontrole fiscal e expansão de moeda sem lastro.</li>
<li><b>Efeitos:</b> perda de poder aquisitivo; dificulta planejamento e investimento; reduz a produtividade (tempo gasto pesquisando preços, especulação com estoques).</li>
<li><b>Distribuição de renda:</b> os pobres sofrem mais (gastam com bens essenciais e não se protegem). Na curva de Lorenz, a curva se afasta da diagonal (mais concentração).</li>
<li><b>Carga tributária:</b> tabela do IR não corrigida pela inflação (IPCA 2015-2020: 37%) aumenta o imposto real.</li>
<li><b>Salários:</b> acima de ~5% ao ano, os preços sobem mês a mês e o reajuste é anual. Países desenvolvidos mantêm inflação abaixo de 2%.</li></ul>
<h3>Deflação e estagflação</h3>
<ul><li><b>Deflação:</b> queda de preços. <b>Keynes:</b> o governo deve aumentar gastos. <b>Austríacos:</b> preços baixos refletem eficiência; sem intervenção a economia se ajusta.</li>
<li><b>Estagflação:</b> atividade fraca com preços em alta.</li></ul>
<h3>Tipos de inflação</h3>
<div class="tw"><table><tr><th>Tipo</th><th>Característica</th><th>Remédio</th></tr>
<tr><td>Expectativas</td><td>Passageira e localizada (festas, Olimpíadas 2016)</td><td>Nenhum necessário</td></tr>
<tr><td>Hiperinflação</td><td>A mais devastadora; guerra ou desastre, governo imprime moeda</td><td>Juros e compulsório altos, corte de gastos, credibilidade fiscal</td></tr>
<tr><td>Demanda</td><td>Demanda &gt; oferta; a principal; déficits fiscais</td><td>Elevar a Selic (Copom, a cada ~45 dias)</td></tr>
<tr><td>Custos / oferta</td><td>Sobe custo de produção: dólar, matérias-primas, energia, salários sem produtividade, oligopólio, clima</td><td>Liberdade comercial, importações, concorrência</td></tr>
<tr><td>Inercial</td><td>Pressão do período anterior transmitida pela indexação (ex.: IPCA 2015 de 10,67% reajustou salários de 2016)</td><td>Desindexação, troca de moeda</td></tr></table></div>
<ul><li><b>Selic alta:</b> poupança fica atrativa, crédito encarece, demanda cai, estoques sobem, preços se estabilizam. <b>Efeito colateral:</b> projetos inviáveis (TIR &lt; TMA), menos investimento, produção e emprego; também aumenta o gasto público com juros da dívida.</li></ul>
<h3>Planos econômicos</h3>
<ul><li><b>Cruzado (1986):</b> troca de moeda e congelamento de preços e salários; juros reais negativos e gasto público alto. Falhou: demanda estimulada e desabastecimento.</li>
<li><b>Cruzado II, Bresser, Verão:</b> novos congelamentos.</li>
<li><b>Collor:</b> congelamento e confisco da poupança, mas abertura às importações e início das privatizações. Caiu com o impeachment.</li>
<li><b>Real (1994, Itamar/FHC):</b> acertou ao diagnosticar cada tipo de inflação.<ul>
<li>Demanda: privatizações, Lei de Responsabilidade Fiscal, juros altos.</li>
<li>Custos: abertura comercial e câmbio livre.</li>
<li>Inercial: desindexação, <b>URV</b> (moeda fictícia atrelada ao dólar) e a nova moeda em 1º/jul/1994.</li>
<li><b>Tripé:</b> juros altos e ajuste fiscal (demanda) + abertura comercial (custos).</li>
<li>IPCA em 12 meses: de 4.923% (jun/94) para 22,4% (dez/95).</li></ul></li></ul>
<h3>Índices de preços</h3>
<div class="tw"><table><tr><th>Índice</th><th>Instituição</th><th>Faixa de renda / composição</th></tr>
<tr><td>IPCA</td><td>IBGE</td><td>1 a 40 salários mínimos, 10 capitais</td></tr>
<tr><td>INPC</td><td>IBGE</td><td>1 a 8 salários mínimos, 10 capitais</td></tr>
<tr><td>IGP-DI</td><td>FGV</td><td>IPA 60% + IPC 30% + INCC 10%</td></tr>
<tr><td>IGP-M</td><td>FGV</td><td>mesma composição, apurado até o dia 20</td></tr>
<tr><td>IPC</td><td>FIPE-USP</td><td>2 a 6 salários mínimos, São Paulo</td></tr></table></div>
<ul><li><b>Inflação acumulada</b> = (1+i₁) × (1+i₂) × … × (1+i₁₂) − 1. Exemplo IPCA 2018: 1,03745 → <b>3,75%</b>.</li>
<li><b>Reajuste de contrato</b> = valor anterior × índice. Aluguel R$ 2.200 × 1,03745 = <b>R$ 2.282,39</b>.</li></ul>
<h3>Mercado de câmbio</h3>
<ul><li><b>Ofertantes de dólar:</b> exportadores, turistas estrangeiros, investidores estrangeiros. <b>Demandantes:</b> importadores, viajantes brasileiros, empresas que pagam dívidas externas.</li>
<li><b>Dólar sobe</b> (real se desvaloriza): produtos nacionais mais baratos no exterior, exportações sobem, importações caem, <b>inflação sobe</b>, atrai turistas e investidores. <b>Dólar cai:</b> o oposto.</li>
<li><b>Dólar × Ibovespa:</b> relação <b>inversa</b>, pois ~1/3 dos investidores da B3 são estrangeiros. <b>Crises</b> são a principal causa da disparada do dólar (fuga de capitais).</li></ul>
<h3>Regimes cambiais</h3>
<ul><li><b>Fixo:</b> BC mantém a cotação com reservas; negociação por outro valor é <b>câmbio paralelo</b>.</li>
<li><b>Bandas:</b> BC define teto e piso; vende dólar no teto e compra no piso.</li>
<li><b>Flutuante:</b> oferta e demanda decidem. <b>Flutuação suja (<i>dirty floating</i>):</b> flutuante com intervenções pontuais do BC.</li></ul>
<h3>Modelo de economia e CPP</h3>
<ul><li><b>Modelo:</b> famílias vendem fatores de produção; empresas vendem bens e serviços; governo cobra tributos e presta serviços; exterior (trocas cambiais).</li>
<li><b>CPP:</b> mais de um bem exige menos de outro. <b>Sobre a curva:</b> pleno uso e eficiência máxima. <b>Abaixo:</b> ociosidade ou ineficiência. <b>Além:</b> inatingível sem novos investimentos.</li>
<li><b>Voo de galinha:</b> a economia se afasta e se aproxima da curva (crise e retomada). <b>Voo de águia:</b> investimento contínuo dilata a curva.</li>
<li><b>Custo de oportunidade crescente:</b> ao transferir recursos entre linhas de produção, a perda na linha original aumenta (perda de ritmo e harmonia).</li>
<li><b>Investimento no Brasil:</b> média de ~17,95% do PIB em 10 anos e 15,79% em 5 anos; média mundial de 22%. Causa: burocracia, tributação, insegurança jurídica, infraestrutura ruim.</li></ul>`,
 q: [
["A inflação brasileira, medida pelo IPCA, nos oito meses até agosto de 2022 foi de: jan/22: 0,54%; fev/22: 1,01%; mar/22: 1,62%; abr/22: 1,06%; mai/22: 0,47%; jun/22: 0,67%; jul/22: -0,68% e ago/22: 0,36%.<br><br>Calcule a inflação acumulada desses oito meses e responda: qual seria o valor de um contrato de aluguel de R$ 1.500,00 ajustado pela inflação desses oito meses? Assinale a alternativa com as respostas corretas.", ["1,0505% e R$ 1.575,75","1,0515% e R$ 1.577,15","5,05% e R$ 1.505,05","5,15% e R$ 1.577,25","5,00% e R$ 1.575,00"], 3, "Índice = 1,0054 × 1,0101 × 1,0162 × 1,0106 × 1,0047 × 1,0067 × 0,9932 × 1,0036 ≈ 1,0515, ou seja, 5,15%. Aluguel = 1.500 × 1,0515 = R$ 1.577,25. Não se soma os meses (daria ≈5,0%): multiplicam-se os fatores. E 1,0515 é o índice, não o percentual."],
["Uma indústria de autopeças importa mensalmente para Estados Unidos cerca de US$ 20.500,00. Se a taxa de câmbio se alterar de US$ 1 = R$ 5,50 para US$ 1 = R$ 5,35, qual é a diferença entre o valor recebido pelo exportador com essa mudança? Qual o nome desse movimento cambial? Assinale a alternativa correta.", ["O importador paga R$ 112.750,00 a mais e o movimento é chamado de valorização do Real.","O importador paga R$ 109.675,00 a mais e o movimento é chamado de desvalorização do Real.","O importador paga exatamente o mesmo valor e o movimento é chamado de flutuação suja.","O importador paga R$ 3.075,00 a menos e o movimento é chamado de valorização do Real.","O importador paga R$ 3.075,00 a mais e o movimento é chamado de desvalorização do Real."], 3, "20.500 × 5,50 = R$ 112.750; 20.500 × 5,35 = R$ 109.675; diferença de R$ 3.075 a menos. O dólar ficou mais barato, então o real se valorizou. Atenção: o enunciado mistura “importa” e “exportador”; a conta é a mesma, e o importador é quem paga em reais."],
["Sobre os tipos de inflação, " + A + "I – A inflação de demanda ocorre quando a procura supera a oferta; para contê-la, o Copom eleva a taxa Selic." + B + "II – A inflação inercial é alimentada pela indexação de salários e contratos à inflação passada." + B + "III – A inflação de custos é causada por excesso de demanda e combatida com juros altos." + B + "IV – A inflação de expectativas é a mais grave, durável e descontrolada de todos os tipos.", ["I e III","II e IV","I e II","III e IV","Todas estão corretas"], 2, "III está errada: custos vêm de insumos, dólar, salários sem produtividade e falta de concorrência. IV está errada: a hiperinflação é a mais devastadora; a de expectativas é passageira e localizada."],
["Sobre os planos econômicos brasileiros, " + A + "I – O Plano Cruzado (1986) congelou preços e salários, o que estimulou a demanda e levou ao desabastecimento." + B + "II – O Plano Collor confiscou a poupança, mas abriu a economia às importações e iniciou privatizações." + B + "III – O Plano Real combateu a inflação de custos com abertura comercial e câmbio livre." + B + "IV – O Plano Real teve como principal medida o congelamento de preços e salários.", ["I, II e IV","I, II e III","II, III e IV","III e IV","Todas estão corretas"], 1, "IV está errada: o Real usou juros altos, ajuste fiscal, privatizações, abertura comercial, desindexação e URV, e não congelamento."],
["O Banco Central define uma cotação máxima e uma mínima para o dólar. Se a cotação atinge o teto, ele vende dólares; se atinge o piso, compra dólares. Esse regime cambial é chamado de:", ["Câmbio fixo","Câmbio flutuante","Flutuação suja","Câmbio paralelo","Bandas cambiais"], 4, "Nas bandas, o BC mantém a cotação entre limites. No fixo, a cotação não muda; no flutuante, oferta e demanda decidem; na flutuação suja, o BC só interfere pontualmente; câmbio paralelo é negociação por valor diferente do oficial."]
]},
{ t: "3 · Desemprego", r: `<h3>Conceito e medição</h3>
<ul><li><b>Desemprego:</b> ociosidade involuntária de quem deseja trabalhar. O IBGE chama de <b>desocupado</b> quem está sem trabalho e tomou providência efetiva nos últimos <b>30 dias</b>.</li>
<li><b>População:</b> abaixo de 14 anos (não em idade de trabalhar) + <b>PIA</b> (14 anos ou mais).</li>
<li><b>PIA</b> = <b>PEA</b> (força de trabalho: ocupados + desocupados) + fora da força de trabalho (estudantes, donas de casa, inválidos, desalentados).</li>
<li><b>Taxa de desemprego = desocupados ÷ PEA.</b> Exemplo (4º tri 2020): 13,925 mi ÷ 100,104 mi ≈ <b>13,9%</b>.</li>
<li><b>Subocupados:</b> trabalham menos de 44h semanais por insuficiência de horas. Só ~40,7% da população produz; ~59,3% depende desses.</li>
<li>Rendimento médio habitual no fim de 2020: R$ 2.507,00.</li></ul>
<h3>Causas do desemprego alto no Brasil</h3>
<ul><li><b>Crises:</b> vendas caem, a produção é reduzida e há demissões. O boom das commodities (anos 2000) reduziu o desemprego; a crise de 2014-2016 e a pandemia o elevaram.</li>
<li><b>Baixa qualificação:</b> falta de base em matemática, linguagens e ciências reduz produtividade e inovação.</li>
<li><b>CLT (1943):</b> rígida, com custo elevado e pouca flexibilidade de horários e condições.</li>
<li><b>Assistencialismo:</b> cria dependência do Estado e desestimula a busca por trabalho e poupança.</li></ul>
<h3>Custo da mão de obra</h3>
<ul><li>Os encargos podem chegar a <b>até 100%</b> do salário. Tabela (56,24%): INSS 20%, FGTS 8%, Sistema S 3,3%, Salário-educação 2,5%, SAT 1 a 3%, 13º 8,33%, férias 11,11%.</li>
<li><b>Exemplo completo</b> (salário R$ 2.000 + 20h extras): encargos diretos de 35,8% (INSS 20%, terceiros 5,8%, SAT 2%, FGTS 8%) e, somadas as provisões de 13º e férias com seus encargos, custo <b>84,32% acima do salário</b> (R$ 3.686,49).</li>
<li>O empregado recebe cerca de <b>90%</b> do salário (INSS e IRPF). Resultado: o empregado acha que recebe pouco e a empresa acha que paga muito.</li></ul>
<h3>Perfil do desemprego</h3>
<ul><li><b>Geração nem-nem:</b> jovens de 15 a 29 anos que não estudam nem trabalham (~1/4 da faixa). A produtividade não evolui, aumentam as dificuldades de colocação e não contribuem com o INSS.</li>
<li><b>Faixa etária:</b> maior entre jovens (pouca experiência, formação incompleta, baixa produtividade).</li>
<li><b>Escolaridade:</b> menos escolaridade, maior desemprego. Exceção: escolaridade muito baixa tem menos desemprego porque aceita trabalhos braçais ou hostis.</li>
<li><b>Diferenças salariais</b> (Anne Bradley): explicadas por produtividade e capital humano (escolha de carreira, experiência, atualização profissional), e não por discriminação. Menos regulação faria o mercado punir quem discrimina.</li></ul>
<h3>Desemprego e Previdência</h3>
<ul><li>Cada demitido é um contribuinte a menos. O número de idosos cresce e as famílias diminuem.</li>
<li>O regime é de <b>partilha</b>: os ativos financiam os aposentados, e a saída de caixa supera a entrada. Há déficit no <b>RGPS</b> (privado) e no <b>RPPS</b> (público).</li></ul>
<h3>Tipos de desemprego</h3>
<div class="tw"><table><tr><th>Tipo</th><th>Quando ocorre</th><th>Exemplo</th></tr>
<tr><td>Friccional / natural</td><td>Troca de emprego, primeiro emprego, saída temporária</td><td>Gestante que se afasta</td></tr>
<tr><td>Sazonal</td><td>Atividades com sazonalidade</td><td>Bares do litoral após o verão; colheita do café</td></tr>
<tr><td>Conjuntural / cíclico</td><td>Crises econômicas</td><td>Demissões na queda das vendas</td></tr>
<tr><td>Estrutural</td><td>Mudança tecnológica extingue a ocupação; exige requalificação</td><td>Caixa de banco → caixa eletrônico → home banking</td></tr></table></div>
<h3>Brasil × EUA e ciclo do atraso</h3>
<ul><li>O desemprego brasileiro é tradicionalmente maior: nos EUA o mercado é mais flexível e há menos burocracia e tributação. Os EUA superaram o Brasil só entre 2008 e 2012 (crise imobiliária).</li>
<li><b>Ciclo do atraso:</b> baixa escolaridade + famílias numerosas + moradia e saúde precárias → baixa produtividade → baixa renda e desemprego → realimenta o ciclo.</li>
<li><b>Bolsa Família:</b> criado para complementar a renda com a condição de os filhos estarem na escola. A apostila critica a transformação em <b>assistencialismo</b> (fraudes, dependência do Estado); em 2012, cerca de 1/4 das famílias era atendida.</li></ul>`,
 q: [
["Em um país, a população é de 210 milhões. Desses, 34 milhões têm menos de 14 anos e 75 milhões da população em idade ativa estão fora da força de trabalho. Há 14 milhões de desocupados. Qual é a taxa de desemprego?", ["6,7%","13,9%","7,9%","18,7%","8,0%"], 1, "PIA = 210 − 34 = 176. PEA = 176 − 75 = 101. Taxa = desocupados ÷ PEA = 14 ÷ 101 ≈ 13,9%. As demais respostas usam o denominador errado (210, 176 ou 75)."],
["Um funcionário tem salário contratado de R$ 2.500,00. Considerando que, com os encargos trabalhistas (INSS patronal, SAT, Sistema S, FGTS e provisões de 13º e férias), o custo da mão de obra fica 84,32% acima do salário, qual é o custo mensal para a empresa?", ["R$ 3.906,00","R$ 5.000,00","R$ 4.608,00","R$ 2.108,00","R$ 2.500,00"], 2, "2.500 × 1,8432 = R$ 4.608,00. R$ 2.108 é só o valor dos encargos (2.500 × 0,8432); R$ 3.906 usaria 56,24%."],
["Sobre os tipos de desemprego, " + A + "I – O desemprego friccional ocorre quando pessoas trocam de emprego ou procuram o primeiro emprego." + B + "II – O desemprego sazonal está ligado a atividades como agricultura e turismo, em que há demissões após a colheita ou a temporada." + B + "III – O desemprego conjuntural decorre de mudanças tecnológicas que extinguem profissões inteiras." + B + "IV – O desemprego estrutural exige requalificação da mão de obra para outra ocupação.", ["I e III","II e III","Todas estão corretas","I, II e IV","I e IV"], 3, "III está errada: o conjuntural (cíclico) decorre das crises; o que decorre da tecnologia é o estrutural."],
["Sobre escolaridade, idade e salários, segundo a apostila, " + A + "I – Quanto maior a escolaridade, maior a taxa de desemprego, pois pessoas qualificadas são mais exigentes." + B + "II – O desemprego é historicamente maior entre os jovens por causa da baixa produtividade (pouca experiência e formação incompleta)." + B + "III – As diferenças salariais são explicadas pela produtividade e pelo capital humano, como a escolha de carreira e a experiência." + B + "IV – O desemprego brasileiro é maior que o dos EUA porque a legislação trabalhista brasileira é mais flexível.", ["I e II","I e IV","III e IV","I, II e III","II e III"], 4, "I está errada: menos escolaridade tende a mais desemprego (com exceção dos trabalhos braçais). IV está errada: a rigidez da legislação brasileira é a causa."],
["Segundo a apostila, o desemprego e a chamada “geração nem-nem” contribuem para o déficit previdenciário porque:", ["quem não trabalha contribui mais ao INSS para compensar a ociosidade.","há menos contribuintes trabalhando formalmente, enquanto cresce o número de idosos beneficiários no regime de partilha.","o regime de capitalização exige que cada trabalhador financie a própria aposentadoria.","o desemprego aumenta a arrecadação previdenciária ao ampliar a base de beneficiários.","o déficit ocorre apenas no regime próprio do setor público (RPPS)."], 1, "A Previdência é de partilha: quem trabalha financia quem já se aposentou. Menos contribuintes e mais idosos geram saída de caixa maior que a entrada; o déficit existe no RGPS e no RPPS."]
]},
{ t: "4 · Organização econômica", r: `<h3>Organização econômica</h3>
<ul><li>É a forma como a sociedade se estrutura para resolver seus problemas e produzir. Dois modelos teóricos opostos: <b>economia de mercado</b> e <b>economia planificada</b>. Na prática, todas as nações têm economia <b>mista</b>.</li></ul>
<h3>Produtividade, lucro e ciclo virtuoso</h3>
<ul><li>Só as atividades que <b>transformam</b> insumos agregam valor; as demais geram custo.</li>
<li><b>Produtividade</b> = competência em transformar insumos em produtos. Produtividade maior → mais produção ou menos custo → <b>lucro maior</b> → mais <b>investimento</b> (variável-chave) → ciclo virtuoso.</li>
<li>Produtividade permite reduzir preços, o que dá acesso às classes menos favorecidas e aumenta o consumo.</li>
<li><b>Taylor:</b> sempre existe um <i>best way</i> de produzir. A concorrência força a busca por eficiência. Lucros extraordinários da inovação atraem imitadores e a prosperidade se espalha.</li></ul>
<h3>Condições para a prosperidade</h3>
<ul><li><b>Instituições estáveis</b> (Douglass North e Ronald Coase) são condição necessária, mas não suficiente. Também: lei enxuta e confiável, liberdade de iniciativa e propriedade privada.</li>
<li><b>Acumulação de capital</b> exige renúncia ao consumo imediato (poupança), ou seja, <b>baixa preferência temporal</b>. Vale para capital físico e intelectual.</li></ul>
<h3>Utilidade marginal e preferência temporal</h3>
<ul><li><b>Utilidade marginal:</b> quanto mais abundante o bem, menor sua utilidade adicional e seu valor (o 2º copo d'água vale menos que o 1º).</li>
<li><b>Preferência temporal</b> (Böhm-Bawerk): maior valorização do consumo presente que do futuro. Os <b>juros</b> são o prêmio por abdicar do consumo atual.</li>
<li>Baixa preferência temporal → poupança → capital → investimento → produção, emprego e renda maiores. Hoppe: crianças e idosos têm maior preferência temporal. Banfield: a classe alta tem visão de longo prazo.</li></ul>
<h3>Economia de mercado × economia planificada</h3>
<div class="tw"><table><tr><th></th><th>Mercado (capitalismo)</th><th>Planificada (socialismo)</th></tr>
<tr><td>Meios de produção</td><td>Propriedade privada</td><td>Do Estado</td></tr>
<tr><td>O que e quanto produzir</td><td>Preços e concorrência</td><td>Planejamento central (comitê estatal)</td></tr>
<tr><td>Liberdade</td><td>Livre escolha para produzir e comerciar</td><td>Agentes privados sem autonomia</td></tr>
<tr><td>Autores</td><td>Smith (mão invisível, <i>laissez-faire</i>), Bastiat, Mises, Hayek, Rothbard, Rand, Sowell</td><td>Marx, Engels, Gramsci</td></tr></table></div>
<ul><li><b>Economia mista:</b> o Estado influencia por leis (conteúdo nacional), incentivos fiscais (Zona Franca de Manaus), crédito de bancos estatais e estatais (Petrobras, Correios, Eletrobrás, Infraero).</li>
<li><b>Equilíbrio de mercado:</b> excesso de oferta → estoques → preços caem → demanda sobe. Excesso de demanda → filas → preços sobem → demanda cai. A intervenção distorce isso (subsídio aos caminhões em 2010 → greve de 2018).</li></ul>
<h3>Socialismo</h3>
<ul><li><b>Consequências (8):</b> 1) falta de liberdade; 2) grupos privilegiados próximos ao governo; 3) luta de classes e corrupção; 4) queda de produtividade; 5) crise constante; 6) desabastecimento; 7) gastos militares elevados; 8) defasagem tecnológica e falta de inovação.</li>
<li>Exemplos citados: Cuba, Venezuela, Coreia do Norte. Contraste: Coreia do Sul, de <b>instituições inclusivas</b> (propriedade segura, sistema jurídico imparcial, livre entrada de empresas, livre escolha de profissão).</li>
<li><b>Huerta de Soto:</b> socialismo = coerção institucional do Estado. <b>Leandro Roque:</b> a socialdemocracia (Estado provedor de tudo) leva a endividamento e estagnação, uma versão mais leve do socialismo. <b>Garschagen:</b> o Brasil aposta em centralização desde as reformas pombalinas (~1750).</li></ul>
<h3>Capitalismo e o papel do Estado</h3>
<ul><li><b>Problemas do capitalismo (3):</b> 1) depende de instituições fortes; 2) marginaliza indivíduos não capacitados; 3) destrói recursos naturais.</li>
<li><b>Respostas:</b> leis enxutas e claras; requalificação e facilidade para empreender; legislação ambiental rigorosa e incentivo ao uso sustentável.</li>
<li><b>Papel do Estado:</b> regulamentação mínima, fiscalização, apoio a setores prioritários (segurança, educação, saúde). Propriedade, liberdade individual e estado de direito devem prevalecer. As <b>instituições, e não as pessoas</b>, definem o rumo.</li></ul>
<h3>Tragédia dos comuns</h3>
<ul><li>Sem direito de propriedade, o recurso comum tende a ser degradado: custo de preservar é alto e o benefício de explorar é grande.</li>
<li><b>Exemplo:</b> conta de água do condomínio dividida igualmente. Com medidores individuais, o consumo cai cerca de <b>40%</b> (Sabesp).</li></ul>
<h3>Instituições</h3>
<ul><li><b>Fortes</b> (North e Coase): garantem direitos de propriedade, reduzem riscos e custos de transação, atraem investimento. <b>Fracas:</b> desrespeito às leis, insegurança jurídica, messianismo e patrimonialismo; estagnação.</li></ul>
<h3>Liberalismo × desenvolvimentismo</h3>
<ul><li><b>Liberalismo:</b> livre concorrência, livre iniciativa e propriedade privada (Smith, Ricardo, Mises, Bastiat). Caso citado: Coreia do Sul.</li>
<li><b>Desenvolvimentismo:</b> Estado ativo com metas de crescimento industrial e infraestrutura; visão keynesiana. No Brasil: JK, regime militar e governos pós-redemocratização (sem muito sucesso). Caso citado: Brasil e Haiti.</li></ul>
<h3>Capitalismo competitivo × de compadrio e destruição criativa</h3>
<ul><li><b>Competitivo</b> (Giambiagi): concorrência pura; o Estado só cria as regras. Surgem Uber, WhatsApp.</li>
<li><b>De compadrio:</b> o Estado escolhe <b>campeãs nacionais</b> com isenções, tarifas protecionistas e crédito facilitado (JBS, empreiteiras). Em nível mundial, a apostila chama de <b>globalismo</b>.</li>
<li><b>Destruição criativa</b> (Schumpeter, 1942): novos produtos substituem os antigos e a <b>inovação</b> é a força motriz do crescimento de longo prazo; o empresário inovador é o protagonista.</li></ul>`,
 q: [
["Em relação às diferenças da Economia de Mercado e a Economia Planificada, assinale a alternativa que apresenta as afirmações corretas:<br><br>I – O sistema de preços é um mecanismo importante em uma economia por sinalizar ao demandante e ao ofertante oportunidades de trocas. Assim, por exemplo, se o preço se eleva, o ofertante enxerga uma oportunidade de ganho, se decidir por aumentar a oferta do bem. O demandante, por sua vez, busca por bens substitutos mais baratos, quando o preço do bem que deseja se eleva. São as ações dos demandantes e ofertantes reagindo às alterações dos preços que levam o mercado ao equilíbrio.<br><br>II – Quando um governo promove a estatização da produção, ele se torna responsável por todas as tarefas da cadeia de produção. Logo, como existe uma quantidade muito grande de bens, de serviços e de atividades de produção, é muito provável que a produção dessa estrutura estatal tenha alta qualidade e que os bens sejam produzidos em grandes quantidades (suficientes) para atender a demanda do país. Haverá, portanto, bens de qualidade e de baixo preço, com aumento da qualidade de vida da população.<br><br>III – Na economia planificada, um comitê central formado por políticos e funcionários públicos coordena todas as atividades de produção necessárias para produzir os bens de que a sociedade precisa. Nesse caso, não há lucro e os salários são iguais, independente da aptidão, da dedicação e do preparo de quem trabalha. Como a divisão do trabalho é estabelecida pelo governo central, há prosperidade na sociedade e ocorrem elevados níveis de inovação e novos investimentos.<br><br>IV – Na economia de mercado, cada indivíduo se especializa em executar algumas poucas tarefas e o sistema de preços se encarrega de permitir a troca, de forma que todos se beneficiem. Por exemplo, o padeiro se especializa em fazer pão com a qualidade que seus clientes desejam e paga ao alfaiate para lhe produzir a roupa que necessita para trabalhar. Essas trocas são voluntárias e incentivam a especialização, de forma que a produção ocorra com rapidez e qualidade. No final, todos são beneficiados pela variedade de opções de compra e pelo preço mais baixo dos bens produzidos.", ["I e II estão corretas.","I e IV estão corretas.","I e III estão corretas.","II, III e IV estão corretas.","Todas estão corretas."], 1, "II e III descrevem resultados que a apostila atribui à economia de mercado, não à planificada: o planejamento central gera desabastecimento, falta de incentivo e baixa inovação. I (preços levam ao equilíbrio) e IV (especialização e trocas voluntárias) estão corretas."],
["Sobre utilidade marginal e preferência temporal, " + A + "I – Pela utilidade marginal, quanto mais abundante um bem, menor a utilidade do consumo adicional e, portanto, menor o seu valor." + B + "II – Preferência temporal é a maior valorização do consumo presente em relação ao futuro; os juros são o prêmio por abdicar do consumo atual." + B + "III – Uma alta preferência temporal favorece a formação de poupança e a acumulação de capital." + B + "IV – Acumular capital exige renúncia ao consumo imediato, o que caracteriza baixa preferência temporal.", ["I e II","II e III","III e IV","I, II e IV","Todas estão corretas"], 3, "III está errada: quem valoriza muito o presente consome e poupa pouco. É a baixa preferência temporal que leva à poupança e ao capital."],
["Um condomínio de 10 apartamentos paga uma conta de água de R$ 12.000,00, dividida igualmente. Após a instalação de medidores individuais, o consumo cai 40% (como no estudo da Sabesp citado na apostila). Qual é a nova conta total, o valor médio por apartamento e o fenômeno que explica a mudança?", ["R$ 7.200,00; R$ 720,00; destruição criativa","R$ 12.000,00; R$ 1.200,00; custo de oportunidade","R$ 7.200,00; R$ 720,00; tragédia dos comuns","R$ 7.200,00; R$ 720,00; capitalismo de compadrio","R$ 4.800,00; R$ 480,00; tragédia dos comuns"], 2, "12.000 × 0,60 = R$ 7.200; ÷ 10 = R$ 720. Com a conta dividida, o desperdício é socializado e ninguém tem incentivo a economizar (tragédia dos comuns). Com medidor, cada um paga o que consome."],

const KEY = 'economia-h02:v1';
const ans = M.map(m => m.q.map(() => null)); // respostas marcadas
let cur = 0, view = 'r'; // 'r' = resumo, 'q' = questões
// carrega progresso salvo (ignora se a estrutura mudou)
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && Array.isArray(s.ans) && s.ans.length === ans.length) {
    s.ans.forEach((r, i) => { if (Array.isArray(r) && r.length === ans[i].length) ans[i] = r; });
    if (Number.isInteger(s.cur) && M[s.cur]) cur = s.cur;
  }
} catch (e) {}
const salvar = () => { try { localStorage.setItem(KEY, JSON.stringify({ ans, cur })); } catch (e) {} };
const $ = id => document.getElementById(id);

function render() {
  // abas
  $('tabs').innerHTML = M.map((m, i) =>
    `<button role="tab" aria-selected="${i === cur}" data-tab="${i}">${m.t}</button>`).join('');
  const m = M[cur], a = ans[cur];
  const acertos = a.filter((v, i) => v === m.q[i][2]).length;
  const feitas = a.filter(v => v !== null).length;
  // sub-abas, resumo completo e questões
  const seg = `<div class="seg"><button data-v="r" aria-pressed="${view === 'r'}">Resumo completo</button><button data-v="q" aria-pressed="${view === 'q'}">Questões (${acertos}/${m.q.length})</button></div>`;
  let body;
  if (view === 'r') body = `<div class="card sum">${m.r}</div>`;
  else body = m.q.map((q, qi) => {
      const r = a[qi], done = r !== null;
      const opts = q[1].map((o, oi) => {
        let c = '';
        if (done && oi === q[2]) c = 'ok';
        else if (done && oi === r) c = 'bad';
        return `<button class="opt ${c}" data-q="${qi}" data-o="${oi}" ${done ? 'disabled' : ''}>${'abcde'[oi]}) ${o}</button>`;
      }).join('');
      const fb = done ? `<div class="fb ${r === q[2] ? 'ok' : 'bad'}"><b>${r === q[2] ? 'Acertou!' : 'Errou. Resposta certa: ' + 'abcde'[q[2]] + ') ' + q[1][q[2]]}</b>${q[3]}</div>` : '';
      return `<div class="card q"><p><b>Questão ${qi + 1}</b><br>${q[0]}</p>${opts}${fb}</div>`;
    }).join('') + `<button class="reset" data-reset="1">Refazer este módulo</button>`;
  $('panel').innerHTML = seg + body;
  // placar geral
  const tot = ans.flat().filter(v => v !== null).length;
  const ok = ans.reduce((s, r, i) => s + r.filter((v, j) => v === M[i].q[j][2]).length, 0);
  $('total').textContent = `Placar geral: ${ok} certas de ${tot} respondidas`;
  salvar();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.v) { view = t.dataset.v; render(); window.scrollTo(0, 0); }
  else if (t.dataset.tab) { cur = +t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.o) { ans[cur][+t.dataset.q] = +t.dataset.o; render(); }
  else if (t.dataset.reset) { ans[cur] = ans[cur].map(() => null); render(); }
});
render();

// PWA: registra o service worker (precisa de HTTPS ou localhost)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
